name: Diagnostics and checkpoint regressions
on:
  push:
    branches: [main, 'codex/publication-20261031']
  pull_request:
permissions:
  contents: read
jobs:
  worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.10'
      - name: Compile the fixed lab experiment before timed worker execution
        run: go test ./test/fault -run '^$' -timeout=20s
      - name: Test isolated proposal jobs and crash recovery
        run: python -B -m unittest discover -s diagnostics -v
