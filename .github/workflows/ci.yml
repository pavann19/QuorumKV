name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -race
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure subprocess race reports
        run: echo "GORACE=log_path=$RUNNER_TEMP/quorumkv-race halt_on_error=1" >> "$GITHUB_ENV"
      - run: go build ./...
      - run: go vet ./...
      # Fast, deterministic unit/integration tests. test/cluster and test/fault
      # spawn real multi-process clusters and take real wall time; bench/ is
      # build-tagged and runs only in its own measurement job below.
      - run: go test $(go list ./... | grep -vE '(test/cluster|test/fault|/bench)') -v -race -timeout 60s
      - name: Check subprocess race reports
        if: always()
        shell: bash
        run: |
          if compgen -G "$RUNNER_TEMP/quorumkv-race.*" > /dev/null; then
            cat "$RUNNER_TEMP"/quorumkv-race.*
            exit 1
          fi

  cluster-and-fault:
    runs-on: ubuntu-latest
    needs: test
    env:
      # Inherit race instrumentation in the node binaries built by the harness.
      GOFLAGS: -race
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure subprocess race reports
        run: echo "GORACE=log_path=$RUNNER_TEMP/quorumkv-race halt_on_error=1" >> "$GITHUB_ENV"
      - name: Multi-process cluster tests (M1 exit criterion)
        run: go test ./test/cluster/... -v -timeout 180s
      - name: Fault-injection scenarios + linearizability checks (M2 exit criterion)
        run: go test ./test/fault/... -v -timeout 300s
      - name: Check subprocess race reports
        if: always()
        shell: bash
        run: |
          if compgen -G "$RUNNER_TEMP/quorumkv-race.*" > /dev/null; then
            cat "$RUNNER_TEMP"/quorumkv-race.*
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fault-histories
          path: test/fault/results/

  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Measured failover time and throughput/latency (M3 exit criterion)
        run: go test -tags=bench ./bench/... -v -timeout 300s
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
