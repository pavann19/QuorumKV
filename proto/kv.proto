syntax = "proto3";

package quorumkv.v1;

option go_package = "github.com/pavann19/quorumkv/proto/quorumkvpb";

// KV is the single-node key-value service the MVP calls for: Get/Put/Delete
// over gRPC, backed by the WAL-durable store in internal/store.
service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  bytes value = 1;
  bool found = 2;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message PutResponse {}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {}
